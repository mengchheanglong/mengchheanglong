<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Mengchheang Long — Backend Engineer</title>
  <desc id="desc">Backend Systems, Distributed Architectures, Polyglot Persistence, and AI Systems</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a" />
      <stop offset="60%" stop-color="#0a0c13" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>

    <!-- Subtle Ambient Lighting -->
    <radialGradient id="cardGlow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanAmbient" cx="40%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Hairline Grid -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.75" />
    </pattern>

    <clipPath id="frameClip">
      <rect width="1200" height="300" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <!-- Base Background -->
    <rect width="1200" height="300" fill="url(#bg)" />
    <rect width="1200" height="300" fill="url(#archGrid)" />

    <!-- Ambient Glows -->
    <rect width="1200" height="300" fill="url(#cyanAmbient)" />
    <circle cx="920" cy="150" r="340" fill="url(#cardGlow)" />

    <!-- Outer Frame Border -->
    <rect width="1200" height="300" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" rx="14" />

    <!-- Registration Crosshairs (Subtle Precision Marks) -->
    <g stroke="#334155" stroke-opacity="0.3" stroke-width="0.75">
      <path d="M 24 16 L 24 24 M 20 20 L 28 20" />
      <path d="M 1176 16 L 1176 24 M 1172 20 L 1180 20" />
      <path d="M 24 276 L 24 284 M 20 280 L 28 280" />
      <path d="M 1176 276 L 1176 284 M 1172 280 L 1180 280" />
    </g>

    <!-- ==================== LEFT: TYPOGRAPHY & IDENTITY ==================== -->
    <g transform="translate(68, 0)">
      
      <!-- Monospace Section Tag -->
      <g transform="translate(0, 52)">
        <text font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="600" fill="#818cf8" letter-spacing="1.8">
          // BACKEND &amp; DISTRIBUTED SYSTEMS
        </text>
      </g>

      <!-- Main Headline: Name -->
      <g transform="translate(0, 118)">
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">
          MENGCHHEANG LONG
        </text>
      </g>

      <!-- Subtitle Focus Statement -->
      <g transform="translate(0, 156)">
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
          Distributed Architectures  •  Polyglot Persistence  •  AI Workflows
        </text>
      </g>

      <!-- Architectural Spec Line -->
      <g transform="translate(0, 214)" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12">
        <text fill="#475569">CORE:</text>
        <text x="50" y="0" fill="#cbd5e1">Microservices</text>
        <text x="160" y="0" fill="#475569">·</text>
        <text x="178" y="0" fill="#cbd5e1">Caching &amp; Rate Limits</text>
        <text x="354" y="0" fill="#475569">·</text>
        <text x="372" y="0" fill="#cbd5e1">Polyglot Datastores</text>
      </g>
    </g>

    <!-- ==================== RIGHT: SLEEK ARCHITECTURE MANIFEST TERMINAL ==================== -->
    <g transform="translate(680, 42)">
      <!-- Terminal Container -->
      <rect width="456" height="216" rx="8" fill="#080b13" stroke="#1e293b" stroke-width="1" />
      
      <!-- Terminal Header Bar -->
      <rect width="456" height="30" rx="8" fill="#0c101a" />
      <rect y="22" width="456" height="8" fill="#0c101a" />
      <line x1="0" y1="30" x2="456" y2="30" stroke="#1e293b" stroke-width="1" />

      <!-- Window Dots -->
      <circle cx="18" cy="15" r="3.5" fill="#334155" />
      <circle cx="32" cy="15" r="3.5" fill="#334155" />
      <circle cx="46" cy="15" r="3.5" fill="#334155" />

      <!-- Window Title -->
      <text x="64" y="19" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" fill="#64748b">
        system.manifest.yaml
      </text>

      <!-- Terminal Body Content -->
      <g transform="translate(20, 56)" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11.5">
        <!-- Line 1 -->
        <text y="0">
          <tspan fill="#475569">01</tspan>
          <tspan dx="12" fill="#818cf8">architecture</tspan><tspan fill="#64748b">:</tspan>
          <tspan dx="8" fill="#f1f5f9">distributed-microservices</tspan>
        </text>

        <!-- Line 2 -->
        <text y="24">
          <tspan fill="#475569">02</tspan>
          <tspan dx="12" fill="#818cf8">runtime</tspan><tspan fill="#64748b">:</tspan>
          <tspan dx="8" fill="#94a3b8">node22 · nestjs · python3</tspan>
        </text>

        <!-- Line 3 -->
        <text y="48">
          <tspan fill="#475569">03</tspan>
          <tspan dx="12" fill="#818cf8">datastores</tspan><tspan fill="#64748b">:</tspan>
          <tspan dx="8" fill="#94a3b8">postgres · mongo · cassandra · redis</tspan>
        </text>

        <!-- Line 4 -->
        <text y="72">
          <tspan fill="#475569">04</tspan>
          <tspan dx="12" fill="#818cf8">traffic_ctrl</tspan><tspan fill="#64748b">:</tspan>
          <tspan dx="8" fill="#94a3b8">caching · rate-limit · queues</tspan>
        </text>

        <!-- Line 5 -->
        <text y="96">
          <tspan fill="#475569">05</tspan>
          <tspan dx="12" fill="#818cf8">ai_stack</tspan><tspan fill="#64748b">:</tspan>
          <tspan dx="8" fill="#94a3b8">rag · llm-integration · ai-agents</tspan>
        </text>

        <!-- Status Footer -->
        <g transform="translate(0, 126)">
          <line x1="0" y1="0" x2="416" y2="0" stroke="#1e293b" stroke-width="0.75" />
          <circle cx="4" cy="14" r="3" fill="#10b981" />
          <text x="14" y="17.5" fill="#10b981" font-size="10.5" font-weight="600" letter-spacing="0.5">STATUS: NOMINAL (99.99%)</text>
          <text x="312" y="17.5" fill="#475569" font-size="10.5">REGION: GLOBAL</text>
        </g>
      </g>
    </g>

    <!-- Bottom Accent Hairline -->
    <line x1="0" y1="298.5" x2="1200" y2="298.5" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5" />
  </g>
</svg>
