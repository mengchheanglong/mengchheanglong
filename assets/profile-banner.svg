<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Mengchheang Long</title>
  <desc id="desc">Software Engineering, AI, Startups, and Immersive Digital Worlds</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7170ff" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#5e6ad2" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5e6ad2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="worldSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17182f"/>
      <stop offset="0.62" stop-color="#101226"/>
      <stop offset="1" stop-color="#090a12"/>
    </linearGradient>
    <linearGradient id="portalRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b9aff"/>
      <stop offset="0.5" stop-color="#7170ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="20"/>
    </clipPath>
    <clipPath id="world">
      <circle cx="1010" cy="150" r="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#surface)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <!-- A generative-world portal: stars, layered terrain, and a simulation grid. -->
    <circle cx="1010" cy="150" r="230" fill="url(#ambientGlow)"/>
    <ellipse cx="1010" cy="150" rx="139" ry="91" fill="none" stroke="#7170ff" stroke-opacity="0.18" transform="rotate(-18 1010 150)"/>

    <g clip-path="url(#world)">
      <circle cx="1010" cy="150" r="104" fill="url(#worldSky)"/>

      <g fill="#d0d6e0">
        <circle cx="950" cy="93" r="1.5" opacity="0.75"/>
        <circle cx="979" cy="69" r="1" opacity="0.55"/>
        <circle cx="1019" cy="84" r="1.3" opacity="0.8"/>
        <circle cx="1053" cy="67" r="1" opacity="0.6"/>
        <circle cx="1080" cy="103" r="1.6" opacity="0.7"/>
        <circle cx="933" cy="126" r="1" opacity="0.45"/>
        <circle cx="1060" cy="125" r="1" opacity="0.5"/>
      </g>

      <path d="M904 164L935 135L959 151L989 116L1018 147L1048 126L1081 153L1118 124L1118 182H904Z" fill="#11152a"/>
      <path d="M904 169L940 149L963 161L992 133L1020 158L1049 141L1080 162L1118 144" fill="none" stroke="#8b8aff" stroke-opacity="0.48" stroke-width="1.2"/>
      <path d="M904 176L945 163L970 169L998 151L1024 169L1053 157L1082 172L1118 160" fill="none" stroke="#7170ff" stroke-opacity="0.28"/>

      <path d="M897 166H1123" stroke="#9b9aff" stroke-opacity="0.36"/>
      <g fill="none" stroke="#7170ff" stroke-opacity="0.22">
        <path d="M912 180H1108"/>
        <path d="M920 197H1100"/>
        <path d="M929 219H1091"/>
        <path d="M941 246H1079"/>
        <path d="M1010 166L876 274"/>
        <path d="M1010 166L932 274"/>
        <path d="M1010 166L980 274"/>
        <path d="M1010 166L1040 274"/>
        <path d="M1010 166L1088 274"/>
        <path d="M1010 166L1144 274"/>
      </g>
      <circle cx="1010" cy="166" r="3" fill="#f7f8f8" filter="url(#softGlow)"/>
    </g>

    <circle cx="1010" cy="150" r="108" fill="none" stroke="#7170ff" stroke-opacity="0.28" stroke-width="1.2"/>
    <circle cx="1010" cy="150" r="104" fill="none" stroke="url(#portalRim)" stroke-width="2.2" filter="url(#softGlow)"/>
    <circle cx="1138" cy="108" r="4.5" fill="#9b9aff" filter="url(#softGlow)"/>
    <circle cx="890" cy="192" r="3" fill="#7170ff" opacity="0.8"/>

    <g font-family="Inter, Arial, Helvetica, sans-serif">
      <text x="72" y="82" fill="#808080" font-size="13" font-weight="600" letter-spacing="2.8">HI, I'M</text>
      <text x="68" y="156" fill="#ffffff" font-size="54" font-weight="600" letter-spacing="-1.8">MENGCHHEANG LONG</text>
      <text x="72" y="208" fill="#a3a3a3" font-size="18" font-weight="400">Software Engineering  •  AI  •  Startups  •  Immersive Digital Worlds</text>
    </g>
  </g>
</svg>
